name: Translations

on: [pull_request]

jobs:
  check:
    name: 'Check translation completeness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Report every locale against en, fail only when pt is incomplete
        run: node lib/js/i18n/bin/check-translations.mjs --require=pt
