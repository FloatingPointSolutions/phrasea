name: Build and push image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      target:
        required: false
        type: string

env:
  COMPOSE_PROJECT_NAME: build
  REGISTRY_NAMESPACE: ghcr.io/floatingpointsolutions/ps-
  DOCKER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  BUILD_CACHE_VERSION: v1
  IMAGE_REGISTRY: ghcr.io/floatingpointsolutions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          file: ${{ inputs.context }}/Dockerfile
          provenance: false
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY_NAMESPACE }}${{ inputs.image }}:build-cache-${{ env.BUILD_CACHE_VERSION }}
          cache-to: type=registry,mode=max,ref=${{ env.REGISTRY_NAMESPACE }}${{ inputs.image }}:build-cache-${{ env.BUILD_CACHE_VERSION }}
          build-args: |
            BASE_TAG=${{ env.DOCKER_TAG }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}${{ inputs.image }}:${{ env.DOCKER_TAG }}
