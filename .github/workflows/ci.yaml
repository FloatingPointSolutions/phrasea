name: CI

on:
  push:
    tags: ['*-mp.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  COMPOSE_PROJECT_NAME: build
  PS_SUBNET: 172.34.0.0/16
  PS_GATEWAY_IP: 172.34.0.1
  TRUSTED_PROXIES: 172.34.0.0/16
  PHRASEA_DOMAIN: phrasea.local
  TRAEFIK_HTTPS_PORT: 4442
  TRAEFIK_HTTP_PORT: 8042
  HTTPS_PORT_PREFIX: ':4442'
  REGISTRY_NAMESPACE: ghcr.io/floatingpointsolutions/ps-
  DOCKER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  BUILD_CACHE_VERSION: v1
  IMAGE_REGISTRY: ghcr.io/floatingpointsolutions
  VERIFY_SSL: "false"
  COMPOSE_PROFILES: databox,expose,uploader,db,rabbitmq,redis,minio,report,mailpit,elasticsearch,dashboard
  FIXTURES_GENERATE_IMAGES: "true"

jobs:
  build_php-fpm-base:
    name: 'Build php-fpm-base'
    uses: ./.github/workflows/build_base.yaml
    with:
      image: php-fpm-base
      context: ./infra/docker/php-fpm-base
    secrets: inherit

  build_configurator:
    name: 'Build Configurator'
    uses: ./.github/workflows/build.yaml
    with:
      image: configurator
      context: ./configurator
      withLibs: true
    secrets: inherit
    needs:
      - build_php-fpm-base

  build_nginx-fpm-base:
    name: 'Build nginx-fpm-base'
    uses: ./.github/workflows/build_base.yaml
    with:
      image: nginx-fpm-base
      context: ./infra/docker/nginx-fpm-base
    secrets: inherit

  build_nginx-client-base:
    name: 'Build nginx-client-base'
    uses: ./.github/workflows/build_base.yaml
    with:
      image: nginx-client-base
      context: ./infra/docker/nginx-client-base
    secrets: inherit

  build_nodejs-base:
    name: 'Build nodejs-base'
    uses: ./.github/workflows/build_base.yaml
    with:
      image: nodejs-base
      context: ./infra/docker/nodejs-base
    secrets: inherit

  build_nginx-cache-purge:
    name: 'Build nginx-cache-purge'
    uses: ./.github/workflows/build_base.yaml
    with:
      image: nginx-cache-purge
      context: ./infra/docker/nginx-cache-purge
    secrets: inherit

  build_dashboard:
    name: 'Build Dashboard'
    uses: ./.github/workflows/build.yaml
    with:
      image: dashboard
      context: ./dashboard/client
      withLibs: true
    secrets: inherit
    needs:
      - build_nodejs-base
      - build_nginx-client-base

  build_databox_api:
    name: 'Build Databox API'
    uses: ./.github/workflows/build_api.yaml
    with:
      prefix: databox
      context: ./databox/api
      withLibs: true
    secrets: inherit
    needs:
      - build_php-fpm-base
      - build_nginx-fpm-base

  build_databox_client:
    name: 'Build Databox Client'
    uses: ./.github/workflows/build.yaml
    with:
      image: databox-client
      context: ./databox/client
      withLibs: true
    secrets: inherit
    needs:
      - build_nodejs-base
      - build_nginx-client-base

  build_databox_indexer:
    name: 'Build Databox Indexer'
    uses: ./.github/workflows/build.yaml
    with:
      image: databox-indexer
      context: ./databox/indexer
      withLibs: true
    secrets: inherit
    needs:
      - build_nodejs-base

  build_expose_api:
    name: 'Build Expose API'
    uses: ./.github/workflows/build_api.yaml
    with:
      prefix: expose
      context: ./expose/api
      withLibs: true
    secrets: inherit
    needs:
      - build_php-fpm-base
      - build_nginx-cache-purge

  build_expose_client:
    name: 'Build Expose Client'
    uses: ./.github/workflows/build.yaml
    with:
      image: expose-client
      context: ./expose/client
      withLibs: true
    secrets: inherit
    needs:
      - build_nodejs-base
      - build_nginx-client-base

  build_report_api:
    name: 'Build Report API'
    uses: ./.github/workflows/build.yaml
    with:
      image: report-api
      context: report
    secrets: inherit

  build_uploader_api:
    name: 'Build Uploader API'
    uses: ./.github/workflows/build_api.yaml
    with:
      prefix: uploader
      context: ./uploader/api
      withLibs: true
    secrets: inherit
    needs:
      - build_php-fpm-base
      - build_nginx-fpm-base

  build_uploader_client:
    name: 'Build Uploader Client'
    uses: ./.github/workflows/build.yaml
    with:
      image: uploader-client
      context: ./uploader/client
      withLibs: true
    secrets: inherit
    needs:
      - build_nodejs-base
      - build_nginx-client-base

  setup:
    name: 'Setup stack'
    runs-on: ubuntu-latest
    needs:
      - build_configurator
      - build_dashboard
      - build_databox_api
      - build_databox_client
      - build_databox_indexer
      - build_expose_api
      - build_expose_client
      - build_report_api
      - build_uploader_api
      - build_uploader_client

    steps:
      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install wget libnss3-tools
          wget https://github.com/FiloSottile/mkcert/releases/download/v1.4.3/mkcert-v1.4.3-linux-amd64
          sudo mv mkcert-v1.4.3-linux-amd64 /usr/bin/mkcert
          sudo chmod +x /usr/bin/mkcert
          mkcert -install

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
            docker compose pull
            docker compose pull configurator

      - name: Setup
        if: "!contains(github.event.head_commit.message, '[skip test]')"
        run: |
          docker compose down --volumes
          bin/dev/make-cert.sh
          sudo PHRASEA_DOMAIN=${PHRASEA_DOMAIN} bin/dev/append-etc-hosts.sh
          bin/setup.sh test

      - name: Test
        if: "!contains(github.event.head_commit.message, '[skip test]') && !contains(github.event.head_commit.message, '[skip php-test]')"
        run: bin/test.sh

      - name: Run Cypress tests
        if: "!contains(github.event.head_commit.message, '[skip test]') && !contains(github.event.head_commit.message, '[skip cypress]')"
        run: |
          docker compose build cypress &
          docker compose up -d --wait expose-api-php --wait-timeout 200 &
          wait
          docker compose exec expose-api-php bin/console hautelook:fixtures:load -n
          docker compose restart expose-api-nginx
          docker compose run --rm cypress

      - name: Extract error output
        if: failure()
        run: |
          docker run -d --rm --name dummy -v ${COMPOSE_PROJECT_NAME}_cypress_output:/cypress/output alpine:3.14.8 tail -f /dev/null
          rm -rf cypress-output
          docker cp dummy:/cypress/output ./cypress-output
          docker stop dummy
          docker compose logs --no-color > docker-logs.log
          docker compose down --volumes

      - name: Upload output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phrasea-output
          path: |
            ./cypress-output/screenshots
            ./cypress-output/results
            ./docker-logs.log
          retention-days: 2

      - name: Clean containers
        if: ${{ always() }}
        run: |
          docker compose down --volumes

      - name: Compute image tag from ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A ref name is not necessarily a valid Docker tag: one must match
          # /[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}/, so "feat/x" is rejected.
          TAG=$(printf '%s' "$REF_NAME" | sed 's/[^A-Za-z0-9_.-]/-/g')
          case "$TAG" in
            [A-Za-z0-9_]*) ;;
            # A tag cannot start with "." or "-".
            *) TAG="_$(printf '%s' "$TAG" | cut -c2-)" ;;
          esac
          if [ ${#TAG} -gt 128 ]; then
            # Keep long refs distinct instead of collapsing them onto one tag.
            TAG="$(printf '%s' "$TAG" | cut -c1-120)-$(printf '%s' "$REF_NAME" | sha1sum | cut -c1-7)"
          fi
          echo "Ref \"$REF_NAME\" -> image tag \"$TAG\""
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Push images to GitHub Container Registry
        run: |
          LATEST_TAG=$(curl \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest | jq --raw-output '.tag_name')

          IS_LATEST=false
          if [ "${LATEST_TAG}" == "${{ github.ref_name }}" ]; then
            IS_LATEST=true
          fi

          docker compose --profile indexer pull databox-indexer

          docker image ls --filter "reference=${{ env.REGISTRY_NAMESPACE }}*:${{ env.DOCKER_TAG }}" --format "{{.Repository}}" | while IFS= read -r repo; do
            docker tag "$repo:${{ env.DOCKER_TAG }}" "$repo:${{ env.IMAGE_TAG }}"
            if [ "$IS_LATEST" = true ]; then
              docker tag "$repo:${{ env.DOCKER_TAG }}" "$repo:latest"
            fi
          done

          export COMPOSE_PROFILES="${COMPOSE_PROFILES},configurator,indexer"
          DOCKER_TAG=${{ env.IMAGE_TAG }} docker compose push

          if [ "$IS_LATEST" = true ]; then
            DOCKER_TAG=latest docker compose push
          fi

